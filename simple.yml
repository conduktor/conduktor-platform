services:
  postgresql:
    image: postgres:14
    hostname: postgresql
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "conduktor-console"
      POSTGRES_USER: "conduktor"
      POSTGRES_PASSWORD: "change_me"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  conduktor-console:
    image: conduktor/conduktor-console:1.49.0
    ports:
      - "8080:8080"
    volumes:
      - conduktor_data:/var/conduktor
    environment:
      CDK_ORGANIZATION_NAME: "getting-started"
      CDK_DATABASE_URL: "postgresql://conduktor:change_me@postgresql:5432/conduktor-console"
      CDK_MONITORING_CORTEX-URL: http://conduktor-monitoring:9009/
      CDK_MONITORING_ALERT-MANAGER-URL: http://conduktor-monitoring:9009/
      CDK_MONITORING_CALLBACK-URL: http://conduktor-platform:8080/monitoring/api/
      CDK_MONITORING_NOTIFICATIONS-CALLBACK-URL: http://localhost:8080
      # Conduktor Agents (needs an Anthropic API key: export ANTHROPIC_API_KEY or set it in .env)
      CDK_ENABLE_AGENTS: "true"
      CDK_MODELS_0_ID: "anthropic"
      CDK_MODELS_0_NAME: "Anthropic"
      CDK_MODELS_0_APIKEY: "${ANTHROPIC_API_KEY:-change_me}"
      # Ask, the in-app assistant (Preview). Needs agents enabled and a model connection.
      CDK_INTERACTIVEAGENTS_ENABLED: "true"
    depends_on:
      postgresql:
        condition: service_healthy
  conduktor-monitoring:
    image: conduktor/conduktor-console-cortex:1.49.0
    environment:
      CDK_CONSOLE-URL: "http://conduktor-console:8080"
volumes:
  pg_data: {}
  conduktor_data: {}
