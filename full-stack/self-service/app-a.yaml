# Grants "app-a" (both its Kafka user and its Keycloak client) ownership of the "orders"
# topic, consumer group and schema subject prefix, via Console self-service.
# Console publishes the permissions to the Schema Registry Proxy over Kafka.
#
#   conduktor apply -f self-service/app-a.yaml
---
apiVersion: self-serve/v1
kind: Application
metadata:
  name: "example-app"
spec:
  title: "Example application"
  owner: "admin"
---
apiVersion: self-serve/v1
kind: ApplicationInstance
metadata:
  application: "example-app"
  name: "app-a"
spec:
  cluster: "local-kafka"
  serviceAccount: "app-a"
  resources:
    - type: TOPIC
      patternType: PREFIXED
      name: "orders"
    - type: SUBJECT
      patternType: PREFIXED
      name: "orders"
    - type: CONSUMER_GROUP
      patternType: PREFIXED
      name: "orders"
